<div class="chatbot-wrapper">

  <!-- Chatbot Floating Button (Bottom Right) -->
  <button 
    type="button" 
    class="chatbot-fab" 
    [class.active]="isOpen" 
    (click)="toggleChat($event)" 
    aria-label="Toggle AI Chatbot"
    title="Chat with Apexon AI Assistant">
    
    <div class="fab-pulse-ring" *ngIf="!isOpen"></div>

    <!-- Closed Icon: Robot with Stars -->
    <i class="bi bi-robot fab-icon" *ngIf="!isOpen"></i>

    <!-- Open/Active Icon: Close X -->
    <i class="bi bi-x-lg fab-icon" *ngIf="isOpen"></i>

    <!-- Unread Badge -->
    <span class="unread-badge" *ngIf="!isOpen && hasUnreadNotification">
      <span class="badge-dot"></span>
    </span>

    <!-- Floating Tooltip on Hover -->
    <span class="fab-tooltip" *ngIf="!isOpen">
      <span class="tooltip-title">AI Assistant</span>
      <span class="tooltip-sub">Explore POCs & Solutions</span>
    </span>
  </button>

  <!-- Chatbot Panel / Window (Rendered cleanly when open) -->
  <div class="chatbot-window" *ngIf="isOpen">

    <!-- Header -->
    <div class="chat-header">
      <div class="header-left">
        <div class="bot-avatar-container">
          <div class="bot-avatar">
            <i class="bi bi-robot"></i>
          </div>
          <span class="status-indicator online"></span>
        </div>
        <div class="header-info">
          <div class="bot-title-row">
            <span class="bot-title">Apexon AI Assistant</span>
            <span class="preview-badge"><i class="bi bi-stars"></i> Preview</span>
          </div>
          <div class="bot-status">
            <span class="pulse-dot"></span>
            Innovation Hub Copilot • Online
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" class="header-btn" (click)="clearChat($event)" title="Restart Conversation">
          <i class="bi bi-arrow-counterclockwise"></i>
        </button>
        <button type="button" class="header-btn" (click)="closeChat($event)" title="Minimize Chat">
          <i class="bi bi-chevron-down"></i>
        </button>
      </div>
    </div>

    <!-- Quick Prompts Bar -->
    <div class="quick-prompts-bar">
      <div class="quick-prompts-title">
        <i class="bi bi-stars icon-sparkle"></i>
        <span>Quick Accelerators</span>
      </div>
      <div class="quick-prompts-list">
        <button 
          type="button" 
          *ngFor="let prompt of quickPrompts" 
          class="prompt-chip" 
          (click)="onQuickPromptClick(prompt)">
          <i [class]="prompt.icon + ' chip-icon'"></i>
          <span>{{ prompt.label }}</span>
        </button>
      </div>
    </div>

    <!-- Chat Messages Body -->
    <div class="chat-body" #chatBody>
      
      <div 
        *ngFor="let msg of messages" 
        class="message-row" 
        [class.user-row]="msg.sender === 'user'" 
        [class.bot-row]="msg.sender === 'bot'">

        <!-- Bot Avatar -->
        <div class="msg-avatar" *ngIf="msg.sender === 'bot'">
          <i class="bi bi-robot"></i>
        </div>

        <div class="msg-content-wrapper">
          <!-- Bubble Text -->
          <div class="msg-bubble" [innerHTML]="msg.formattedText || msg.text"></div>

          <!-- Direct Action Buttons (e.g. Navigation or DB Scanner Triggers) -->
          <div class="msg-actions" *ngIf="msg.actions && msg.actions.length > 0">
            <button 
              type="button" 
              *ngFor="let act of msg.actions" 
              class="action-btn" 
              [class.primary-action]="act.variant === 'primary'" 
              [class.danger-action]="act.variant === 'danger'" 
              (click)="handleAction(act)">
              <i [class]="act.icon + ' action-icon'" *ngIf="act.icon"></i>
              <span>{{ act.label }}</span>
              <i class="bi bi-chevron-right chevron-icon"></i>
            </button>
          </div>

          <!-- Interactive Chips -->
          <div class="msg-chips" *ngIf="msg.chips && msg.chips.length > 0">
            <button 
              type="button" 
              *ngFor="let chip of msg.chips" 
              class="followup-chip" 
              (click)="selectPrompt(chip)">
              {{ chip }}
            </button>
          </div>

          <!-- Timestamp -->
          <div class="msg-time">
            {{ msg.timestamp | date:'shortTime' }}
          </div>
        </div>

        <!-- User Avatar -->
        <div class="msg-avatar user-avatar" *ngIf="msg.sender === 'user'">
          <i class="bi bi-person-fill"></i>
        </div>

      </div>

      <!-- Typing Indicator -->
      <div class="message-row bot-row typing-row" *ngIf="isTyping">
        <div class="msg-avatar">
          <i class="bi bi-robot"></i>
        </div>
        <div class="typing-bubble">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>

    </div>

    <!-- Chat Input Footer -->
    <div class="chat-footer">
      <form class="chat-input-form" (ngSubmit)="sendMessage()">
        <input 
          type="text" 
          [(ngModel)]="userInput" 
          name="userChatMessage" 
          (keydown.enter)="onEnterPress($event)" 
          placeholder="Ask a question or explore accelerators..." 
          class="chat-input" 
          autocomplete="off" 
          [disabled]="isTyping"
        />

        <button 
          type="submit" 
          class="send-btn" 
          [disabled]="!userInput.trim() || isTyping" 
          title="Send message">
          <i class="bi bi-send-fill"></i>
        </button>
      </form>
    </div>

  </div>

</div>
